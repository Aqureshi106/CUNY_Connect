<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CUNY Connect — Profile</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page-bg">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>

    <div class="shell-card">
      <aside class="sidebar">
        <div class="sidebar-user">
          <div class="avatar avatar-lg" id="sidebar-avatar">—</div>
          <span class="welcome">Welcome back,</span>
          <span class="name" id="sidebar-name">—</span>
        </div>
        <nav class="sidebar-nav">
          <a class="sidebar-link" href="dashboard.html"><span class="icon icon-home"></span><span>Home</span></a>
          <a class="sidebar-link" href="ai.html"><span class="icon icon-bot"></span><span>CUNY AI</span></a>
          <a class="sidebar-link" href="rewards.html"><span class="icon icon-gift"></span><span>Rewards</span></a>
          <a class="sidebar-link" href="profile.html"><span class="icon icon-user"></span><span>Profile</span></a>
        </nav>
        <a href="#" id="signout-link" class="sidebar-link sidebar-signout"><span class="icon icon-logout"></span><span>Sign out</span></a>
      </aside>

      <main class="main-column">
        <div class="page-inner">
          <div class="page-header">
            <h1 class="page-heading"><span class="icon icon-user" style="width:22px;height:22px;vertical-align:-3px;"></span> Profile</h1>
            <div id="points-badge" class="badge badge-tint"><span class="icon icon-flame"></span>— CUNY Points</div>
          </div>
          <p class="page-subheading">Your CUNY Connect stats.</p>

          <div class="card profile-card">
            <div class="avatar avatar-lg" id="profile-avatar"><span class="icon icon-user" style="width:24px;height:24px;background:var(--blue-600);"></span></div>
            <div>
              <h2 id="profile-name" style="margin: 0 0 4px;">—</h2>
              <div class="feed-item-meta">
                <span id="profile-campus">—</span>
                <span class="dot"></span>
                <span id="profile-email">—</span>
              </div>
            </div>
          </div>

          <div class="card stats-row">
            <div class="stat-tile">
              <div class="stat-value" id="profile-points">—</div>
              <div class="stat-label">CUNY Points</div>
            </div>
            <div class="stat-tile">
              <div class="stat-value" id="profile-post-count">—</div>
              <div class="stat-label">Posts made</div>
            </div>
          </div>

          <div class="card">
            <h3 style="margin: 0 0 var(--space-3);">Owned rewards</h3>
            <div id="owned-rewards"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="js/profile.js"></script>
</body>
</html>
